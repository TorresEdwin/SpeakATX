stages:
  - build
  - test

build-and-test-frontend:
  stage: build
  image: node:latest
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}
    paths:
      - frontend/node_modules/
    policy: pull-push
  before_script:
    - cd frontend
    - npm install
  script:
    - echo "Building..."
    - npm run build    
    - echo "Build successful"
    - echo "Running unit tests..."
    - npm run test
    - echo "Tests completed"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: always

test-flask-backend:
  stage: test
  image: python:3.12
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install pytest requests
  script:
    - echo "Running Flask app tests..."
    - pytest test_app.py
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: always