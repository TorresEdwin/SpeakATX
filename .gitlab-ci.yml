stages:
  - build
  - test
  - test_backend
  - test_acceptance
  - test_postman

build-and-test-frontend:
  stage: build
  image: node:latest
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}
    paths:
      - frontend/node_modules/
    policy: pull-push
  before_script:
    - cd frontend
    - npm install
  script:
    - echo "Building..."
    - npm run build    
    - echo "Build successful"
    - echo "Running unit tests..."
    - npm run test
    - echo "Tests completed"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: always

test-flask-backend:
  stage: test_backend
  image: python:3.12
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install pytest requests
  script:
    - echo "Running Flask app tests..."
    - pytest test_app.py
  rules:
    - if: '$CI_COMMIT_REF_NAME == "qegoiegoh"'
      when: always

test-acceptance:
  stage: test_acceptance
  image: python:3.12-slim
  before_script:
    - apt-get update
    - apt-get install -y wget gnupg2 unzip
    # Install Chrome
    - wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
    - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
    - apt-get update
    - apt-get install -y google-chrome-stable
    # Install required dependencies
    - cd frontend/__tests__
    - pip install --upgrade pip
    - pip install selenium pytest chromedriver-autoinstaller
  script:
    - echo "Running frontend acceptance tests..."
    - python frontend_acceptance.py
  rules:
    - if: '$CI_COMMIT_REF_NAME == "qoihopeghg"'
      when: always

postman-tests:
  stage: test_postman
  image: 
    name: postman/newman:alpine
    entrypoint: [""]
  script:
    - newman --version
    - newman run SpeakATX.postman_collection.json
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: always